name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to build and publish (leave blank for build only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18

      - name: Install PS5 Payload SDK
        run: |
          wget --quiet https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar -xf ps5-payload-dev.tar.gz -C /

      - name: Build
        run: |
          make format-check CLANG_FORMAT=clang-format-18 PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make test PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: headless-linkdev
          path: headless-linkdev.elf
          if-no-files-found: error

      - name: Publish tagged release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must begin with v" >&2; exit 1 ;;
          esac

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" headless-linkdev.elf --clobber
          else
            gh release create "$RELEASE_TAG" headless-linkdev.elf \
              --verify-tag \
              --generate-notes \
              --title "Headless LinkDev $RELEASE_TAG"
          fi
