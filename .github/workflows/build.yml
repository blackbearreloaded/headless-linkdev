name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-format-18 lld-18

      - name: Install PS5 Payload SDK
        run: |
          wget --quiet https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar -xf ps5-payload-dev.tar.gz -C /

      - name: Build
        run: |
          make format-check CLANG_FORMAT=clang-format-18 PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make test PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: headless-linkdev
          path: headless-linkdev.elf
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: headless-linkdev.elf
